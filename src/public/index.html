<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant Ordering Chatbot</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f5f7;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-box {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      height: 82vh;
      overflow: hidden;
    }
    .chat-header {
      background: #1e293b;
      color: #ffffff;
      padding: 14px 18px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header span.sub {
      font-size: 12px;
      opacity: 0.8;
      font-weight: 400;
    }
    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.45;
      font-size: 14px;
    }
    .msg.bot {
      background: #eef2f6;
      color: #0f172a;
      align-self: flex-start;
    }
    .msg.user {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
    }
    .pay-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #e2e8f0;
      background: #fff;
    }
    .input-area input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }
    .input-area button {
      padding: 10px 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-area button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">
      <div>MealBot Kitchen</div>
      <span class="sub" id="deviceLabel"></span>
    </div>
    <div class="messages" id="messages"></div>
    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="userInput"
        placeholder="Type an option (e.g. 1, 99, 98, 97, 0)..."
        autocomplete="off"
        required
      />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "mealbot_device_id";
    let deviceId = localStorage.getItem(STORAGE_KEY);
    if (!deviceId) {
      deviceId = "dev_" + crypto.randomUUID().replace(/-/g, "");
      localStorage.setItem(STORAGE_KEY, deviceId);
    }

    document.getElementById("deviceLabel").textContent = "Session: " + deviceId.slice(0, 12);

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chatForm");
    const inputEl = document.getElementById("userInput");

    function appendMessage(text, sender, paymentUrl = null) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;

      if (paymentUrl) {
        const link = document.createElement("a");
        link.href = paymentUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "pay-btn";
        link.textContent = "Pay with Paystack";
        div.appendChild(document.createElement("br"));
        div.appendChild(link);
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function handlePaymentRedirectBanner() {
      const params = new URLSearchParams(window.location.search);
      const paymentStatus = params.get("payment");
      if (!paymentStatus) return;

      if (paymentStatus === "success") {
        const orderId = params.get("orderId") || "your order";
        const amount = params.get("amount");
        const amtText = amount ? ` of ₦${Number(amount).toLocaleString()}` : "";
        appendMessage(
          `Payment successful! Thank you — payment${amtText} for ${orderId} has been confirmed.`,
          "bot"
        );
      } else {
        const msg = params.get("message") || "Payment was not completed.";
        appendMessage(`Payment notice: ${msg}`, "bot");
      }

      window.history.replaceState({}, document.title, "/");
    }

    async function loadInitialGreeting() {
      const res = await fetch("/api/session", {
        headers: { "x-device-id": deviceId },
      });
      const data = await res.json();
      if (data.reply) {
        appendMessage(data.reply, "bot");
      }
      await handlePaymentRedirectBanner();
    }

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      inputEl.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-device-id": deviceId,
          },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        appendMessage(data.reply || "No response from bot.", "bot", data.paymentUrl || null);
      } catch (err) {
        appendMessage("Network error. Please try again.", "bot");
      }
    });

    loadInitialGreeting();
  </script>
</body>
</html>
